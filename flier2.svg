<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="Poppins, 'Segoe UI', Arial, Helvetica, sans-serif">
  <title>PawPal Pets sample flier</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a7a"/>
      <stop offset="1" stop-color="#4a8fe7"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <circle cx="990" cy="90" r="260" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="50" cy="1010" r="240" fill="#ffffff" fill-opacity="0.07"/>

  <rect x="70" y="56" width="520" height="48" rx="24" fill="#ffffff" fill-opacity="0.16"/>
  <text x="96" y="89" font-size="22" font-weight="700" letter-spacing="3" fill="#ffffff">IT311 E-COMMERCE SHOWCASE</text>
  <text x="1010" y="89" text-anchor="end" font-size="24" font-weight="700" letter-spacing="2" fill="#ffffff">SITE 02</text>

  <circle cx="540" cy="380" r="254" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>
  <circle cx="540" cy="380" r="220" fill="#ffffff" filter="url(#shadow)"/>
  <g transform="translate(0,-18)" fill="#1e4fa8">
  <path d="M540 385C595 385 640 430 640 480C640 520 610 535 575 530C555 527 548 520 540 520C532 520 525 527 505 530C470 535 440 520 440 480C440 430 485 385 540 385Z"/>
  <ellipse cx="438" cy="360" rx="30" ry="42" transform="rotate(-25 438 360)"/>
  <ellipse cx="502" cy="305" rx="31" ry="44"/>
  <ellipse cx="578" cy="305" rx="31" ry="44"/>
  <ellipse cx="642" cy="360" rx="30" ry="42" transform="rotate(25 642 360)"/>
</g>

  <text x="540" y="730" text-anchor="middle" font-size="100" font-weight="800" fill="#ffffff">PawPal Pets</text>
  <text x="540" y="790" text-anchor="middle" font-size="34" font-weight="400" fill="#ffffff" fill-opacity="0.92">Everything your furry friend needs</text>

  <rect x="234" y="836" width="259" height="56" rx="28" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/><text x="364" y="873" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff">Food &amp; Treats</text><rect x="516" y="836" width="124" height="56" rx="28" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/><text x="578" y="873" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff">Toys</text><rect x="662" y="836" width="184" height="56" rx="28" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/><text x="754" y="873" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff">Grooming</text>

  <rect x="140" y="940" width="800" height="92" rx="46" fill="#ffffff" filter="url(#shadow)"/>
  <text x="540" y="999" text-anchor="middle" font-size="34" font-weight="700" fill="#123a7a">SHOP NOW  &#8226;  pawpal.example.com</text>
</svg>
