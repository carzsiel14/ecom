<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="Poppins, 'Segoe UI', Arial, Helvetica, sans-serif">
  <title>StyleLoop sample flier</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d47a1"/>
      <stop offset="1" stop-color="#5aa0f0"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <circle cx="990" cy="90" r="260" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="50" cy="1010" r="240" fill="#ffffff" fill-opacity="0.07"/>

  <rect x="70" y="56" width="520" height="48" rx="24" fill="#ffffff" fill-opacity="0.16"/>
  <text x="96" y="89" font-size="22" font-weight="700" letter-spacing="3" fill="#ffffff">IT311 E-COMMERCE SHOWCASE</text>
  <text x="1010" y="89" text-anchor="end" font-size="24" font-weight="700" letter-spacing="2" fill="#ffffff">SITE 03</text>

  <circle cx="540" cy="380" r="254" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>
  <circle cx="540" cy="380" r="220" fill="#ffffff" filter="url(#shadow)"/>
  <g transform="translate(0,34)" fill="none" stroke="#1e4fa8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
  <path d="M540 340V310Q540 290 560 285Q590 278 590 250Q590 215 555 215Q525 215 520 245"/>
  <path d="M540 340L370 455Q355 470 375 470H705Q725 470 710 455Z"/>
</g>

  <text x="540" y="730" text-anchor="middle" font-size="100" font-weight="800" fill="#ffffff">StyleLoop</text>
  <text x="540" y="790" text-anchor="middle" font-size="34" font-weight="400" fill="#ffffff" fill-opacity="0.92">Trendy fashion for every day</text>

  <rect x="144" y="836" width="244" height="56" rx="28" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/><text x="266" y="873" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff">New Arrivals</text><rect x="410" y="836" width="244" height="56" rx="28" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/><text x="532" y="873" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff">Easy Returns</text><rect x="676" y="836" width="259" height="56" rx="28" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/><text x="806" y="873" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff">Up to 50% Off</text>

  <rect x="140" y="940" width="800" height="92" rx="46" fill="#ffffff" filter="url(#shadow)"/>
  <text x="540" y="999" text-anchor="middle" font-size="34" font-weight="700" fill="#0d47a1">SHOP NOW  &#8226;  styleloop.example.com</text>
</svg>
